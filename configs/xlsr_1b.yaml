run_name: xlsr_1b_ctc_all
model:
  name: facebook/wav2vec2-xls-r-1b
  freeze_feature_encoder: true
data:
  dataset_dir: data/processed
  languages: null
text:
  normalization: language_safe
evaluation:
  normalization: language_safe
tracking:
  report_to: none
  local_dir: outputs/experiments
training_args:
  output_dir: checkpoints/xlsr_1b_ctc_all
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  warmup_steps: 500
  max_steps: 4000
  fp16: true
  gradient_checkpointing: true
  eval_strategy: steps
  save_strategy: steps
  save_steps: 250
  eval_steps: 250
  logging_steps: 100
  save_total_limit: 2
  seed: 42
  group_by_length: true
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false

