run_name: xlsr_1b_clean_audio_only_v1
model:
  name: facebook/wav2vec2-xls-r-1b
  freeze_feature_encoder: true
data:
  # cleaned-audio dataset built by scripts/clean_and_trim_audio_dataset.py
  # (preprocessing_version clean_audio_v1); train split = clean bucket only
  dataset_dir: data/final_combined_clean_audio_dataset
  extra_train_splits: []
  train_manifest: null
  include_medium: false
  languages: null
  min_duration: 0.30
  max_duration: 50.0
  language_balanced_sampling: true
  lazy_preprocessing: true
text:
  normalization: language_safe
evaluation:
  normalization: language_safe
tracking:
  report_to: none
  local_dir: outputs/experiments
training_args:
  output_dir: checkpoints/xlsr_1b_clean_audio_only_v1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  warmup_steps: 2400
  max_steps: 24000
  bf16: true
  gradient_checkpointing: true
  eval_strategy: steps
  save_strategy: steps
  save_steps: 500
  eval_steps: 500
  logging_steps: 50
  save_total_limit: 5
  seed: 42
  group_by_length: true
  load_best_model_at_end: true
  metric_for_best_model: eval_cer
  greater_is_better: false
