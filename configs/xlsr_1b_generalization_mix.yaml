run_name: xlsr_1b_generalization_mix
model:
  name: facebook/wav2vec2-xls-r-1b
  freeze_feature_encoder: true
data:
  dataset_dir: data/processed_generalization_mix
  train_manifest: null
  include_medium: false
  languages: null
  min_duration: 0.30
  max_duration: 50.0
  language_balanced_sampling: true
  lazy_preprocessing: true
text:
  normalization: language_safe
evaluation:
  normalization: language_safe
tracking:
  report_to: none
  local_dir: outputs/experiments
training_args:
  output_dir: checkpoints/xlsr_1b_generalization_mix
  # effective batch 16 (4 x 4), same as the 300m run, so per-step eval curves
  # are directly comparable for the early-stop decision at step 3000-5000
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  # 1B fine-tunes want a lower LR than 300m; 3e-4 destabilizes the larger model
  learning_rate: 1.0e-4
  warmup_steps: 2400
  max_steps: 24000
  # bf16 instead of fp16: XLS-R 1B is known to overflow under fp16, and the
  # Blackwell GPU + torch 2.11 support bf16 natively
  bf16: true
  gradient_checkpointing: true
  eval_strategy: steps
  save_strategy: steps
  save_steps: 500
  eval_steps: 500
  logging_steps: 50
  save_total_limit: 5
  seed: 42
  group_by_length: true
  load_best_model_at_end: true
  metric_for_best_model: eval_cer
  greater_is_better: false
