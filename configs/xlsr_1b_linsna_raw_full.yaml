run_name: xlsr_1b_linsna_raw_full
model:
  name: facebook/wav2vec2-xls-r-1b
  processor_name: champion_repo/checkpoint-24000
  vocab_size: 110
  freeze_feature_encoder: true
  regularization:
    hidden_dropout: 0.10
    activation_dropout: 0.05
    layerdrop: 0.05
    mask_time_prob: 0.075
    mask_feature_prob: 0.05
data:
  dataset_dir: data/processed
  languages: [lin, sna]
  min_duration: 0.30
  max_duration: 50.0
  language_balanced_sampling: false
  lazy_preprocessing: true
text:
  normalization: language_safe
evaluation:
  normalization: language_safe
tracking:
  report_to: none
  local_dir: outputs/experiments
training_args:
  output_dir: /mnt/serving_eval/waxal/xlsr_1b_linsna_raw_full
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: linear
  warmup_steps: 1000
  max_steps: 10000
  weight_decay: 0.01
  max_grad_norm: 1.0
  optim: adamw_torch_fused
  bf16: true
  gradient_checkpointing: true
  eval_strategy: steps
  save_strategy: steps
  eval_steps: 1000
  save_steps: 2000
  save_total_limit: 2
  save_only_model: true
  logging_steps: 50
  seed: 42
  load_best_model_at_end: false
  dataloader_num_workers: 4
