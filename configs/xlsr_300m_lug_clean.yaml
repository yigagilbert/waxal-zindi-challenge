run_name: xlsr_300m_lug_clean
model:
  name: facebook/wav2vec2-xls-r-300m
  freeze_feature_encoder: true
data:
  dataset_dir: data/processed
  train_manifest: data/quality/clean_train.csv
  include_medium: false
  languages:
    - lug
  min_duration: 0.30
  max_duration: 30.0
  language_balanced_sampling: false
text:
  normalization: language_safe
evaluation:
  normalization: language_safe
tracking:
  report_to: none
  local_dir: outputs/experiments
training_args:
  output_dir: checkpoints/xlsr_300m_lug_clean
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  warmup_steps: 200
  max_steps: 2500
  fp16: true
  gradient_checkpointing: true
  eval_strategy: steps
  save_strategy: steps
  save_steps: 250
  eval_steps: 250
  logging_steps: 50
  save_total_limit: 3
  seed: 42
  group_by_length: true
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
