run_name: xlsr_champion_ssl_continue
# Noisy-student continuation (2026-08-04): champion + confidence-filtered pseudo
# labels from the OFFICIAL WaxalNLP unlabeled lin/sna splits (new speakers - the
# measured weakness; bench 0.882 on seen speakers vs 0.729 public on unseen).
# Teacher = champion beam+LM decode; filter = greedy/beam disagreement <= 0.10.
# Student trains with the SpecAugment robustness settings (augmented student,
# clean teacher labels). LR low; ~2 epochs over labeled+pseudo.
# GATES (both required before any submission):
#   1. AfriVoices OOD (600 clips / 151 unseen speakers):
#      champion baseline WER 0.33365 CER 0.08193 combined 0.20779 - must improve
#   2. 800-row WAXAL bench: must not regress materially (< -0.002)
model:
  name: champion_repo/checkpoint-24000
  load_processor_from_checkpoint: true
  freeze_feature_encoder: true
  regularization:
    mask_time_prob: 0.10
    mask_time_length: 10
    mask_feature_prob: 0.10
    mask_feature_length: 64
    hidden_dropout: 0.05
    activation_dropout: 0.05
    attention_dropout: 0.05
    layerdrop: 0.05
data:
  dataset_dir: data/processed
  extra_train_splits: [pseudo]
  languages: [lin, sna]
  min_duration: 0.30
  max_duration: 50.0
  language_balanced_sampling: true
  lazy_preprocessing: true
text:
  normalization: language_safe
evaluation:
  normalization: language_safe
tracking:
  report_to: none
  local_dir: outputs/experiments
training_args:
  output_dir: checkpoints/xlsr_champion_ssl
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-5
  warmup_steps: 300
  max_steps: 6000
  fp16: true
  gradient_checkpointing: true
  eval_strategy: steps
  save_strategy: steps
  save_steps: 1000
  eval_steps: 1000
  logging_steps: 50
  save_total_limit: 2
  seed: 42
  load_best_model_at_end: true
  metric_for_best_model: eval_cer
  greater_is_better: false
